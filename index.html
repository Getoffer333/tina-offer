<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校招机会看板 · Tina求职咨询</title>
<style>
:root{
  --paper:#f5f1e8; --card:#fdfbf6; --ink:#26221c; --ink2:#5a544a;
  --brand:#1c2a52; --brand2:#2b4075; --gold:#c8a45c; --gold2:#e0c48a;
  --red:#b33a2c; --line:#e2dccd; --line2:#d4cdbb;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Songti SC","Noto Serif SC","SimSun",serif;background:var(--paper);color:var(--ink)}
/* ===== 锁屏 ===== */
#lock{position:fixed;inset:0;background:linear-gradient(160deg,var(--brand) 0%,var(--brand2) 70%);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px}
#lock.hidden{display:none}
.lock-card{background:var(--card);border-radius:16px;max-width:400px;width:100%;padding:36px 32px 32px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.lock-logo{font-size:22px;font-weight:700;letter-spacing:2px}
.lock-logo em{font-style:normal;color:var(--gold)}
.lock-sub{font-size:13px;color:var(--ink2);margin:8px 0 24px;letter-spacing:1px}
.pass-wrap{display:flex;gap:8px;margin-bottom:12px}
#passInput{flex:1;padding:12px 14px;border:1.5px solid var(--line2);border-radius:10px;font-size:18px;letter-spacing:4px;text-align:center;font-family:inherit;outline:none;background:#fff}
#passInput:focus{border-color:var(--gold)}
#unlockBtn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-family:inherit;cursor:pointer;letter-spacing:2px}
#unlockBtn:hover{background:var(--brand2)}
#lockErr{color:var(--red);font-size:12.5px;min-height:18px;margin-bottom:8px}
.qr-box{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line2)}
.qr-box img{width:150px;height:auto;border-radius:8px;border:1px solid var(--line)}
.qr-title{font-size:14px;font-weight:600;margin:10px 0 4px}
.qr-tip{font-size:12.5px;color:var(--ink2);line-height:1.7}
.qr-tip b{color:var(--red)}
/* ===== 头部 ===== */
header{background:linear-gradient(160deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;padding:26px 20px 0}
.h-inner{max-width:1080px;margin:0 auto}
.hero-title{font-size:32px;font-weight:700;text-align:center;letter-spacing:4px;margin:0 0 12px;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;line-height:1.3}
.hero-title em{font-style:normal;color:var(--gold2)}
.brand-row{display:flex;align-items:baseline;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center}
.brand{font-size:24px;font-weight:700;letter-spacing:2px}
.brand em{font-style:normal;color:var(--gold2)}
.brand-sub{font-size:12.5px;opacity:.85;letter-spacing:.5px}
.stats{display:flex;gap:10px;margin-top:22px;padding-bottom:22px;flex-wrap:wrap}
.stat{flex:1;min-width:150px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:12px 16px}
.stat b{display:block;font-size:28px;line-height:1.15;font-weight:700}
.stat b i{font-style:normal;font-size:13px;font-weight:400;opacity:.7;margin-left:4px}
.stat small{font-size:12px;opacity:.8}
.stat.hot{border-color:var(--gold2)}
.stat.hot b{color:var(--gold2)}
.stat.red b{color:#ff8a75}
/* ===== 主区 ===== */
main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:10px;z-index:50;box-shadow:0 3px 14px rgba(60,50,30,.07)}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:6px 14px;border:1px solid var(--line2);border-radius:20px;font-size:12.5px;background:#fff;cursor:pointer;color:var(--ink2);font-family:inherit;transition:all .15s}
.chip:hover{border-color:var(--gold);color:var(--brand)}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
.chip-label{font-size:12.5px;color:var(--ink2);align-self:center;letter-spacing:1px;padding-right:2px}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
#search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line2);border-radius:8px;font-size:14px;outline:none;font-family:inherit;background:#fff}
#search:focus{border-color:var(--gold)}
.sort-group{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.sort-group button{border:none;background:#fff;padding:10px 14px;font-size:13px;cursor:pointer;color:var(--ink2);font-family:inherit}
.sort-group button.active{background:var(--brand);color:#fff}
.view-toggle{margin-left:auto;display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.view-toggle button{border:none;background:#fff;padding:10px 12px;cursor:pointer;font-size:13px;color:var(--ink2);font-family:inherit}
.view-toggle button.active{background:var(--brand);color:#fff}
.filters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
select{padding:8px 10px;border:1px solid var(--line2);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);outline:none;font-family:inherit;max-width:170px}
.count-line{font-size:13px;color:var(--ink2);margin:16px 2px 12px;letter-spacing:.5px}
.count-line b{color:var(--red)}
/* ===== 列表视图（多列对齐） ===== */
.list{display:flex;flex-direction:column;gap:8px}
.list .row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 18px;display:grid;grid-template-columns:190px minmax(0,1fr) 180px 150px 86px 120px;gap:16px;align-items:center;transition:border-color .18s, box-shadow .18s}
.list .row:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(60,50,30,.08)}
.list .company{font-size:14.5px;font-weight:700;color:var(--brand);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list h3{font-size:14.5px;font-weight:600;margin:0;line-height:1.4;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list h3 a{color:var(--ink);text-decoration:none}
.list h3 a:hover{color:var(--brand)}
.list .tags{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden;justify-content:center}
.tag{font-size:11.5px;color:var(--ink2);background:transparent;border:1px solid var(--line2);padding:1px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.tag.place{border-style:dashed;color:var(--brand2)}
.list .meta{display:flex;gap:10px;font-size:12.5px;color:var(--ink2);justify-content:center;white-space:nowrap}
.list .meta .pub{display:none}
.list .deadline{color:var(--ink);font-weight:600}
.list .deadline.urgent{color:var(--red);font-weight:700}
.list .deadline.soon{color:#a86f0f;font-weight:700}
.list .actions{margin:0;display:flex;justify-content:flex-end}
.list .heat{text-align:center;flex-shrink:0}
.list .heat b{font-size:16px;color:var(--gold);font-weight:700}
.list .heat small{font-size:10.5px;color:var(--ink2)}
.list .badges{display:none}
.list .topline{display:contents}
.list .main{display:contents}
/* ===== 卡片视图 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.grid .row{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;background:var(--card);transition:border-color .18s, box-shadow .18s, transform .18s}
.grid .row:hover{border-color:var(--gold);box-shadow:0 6px 20px rgba(60,50,30,.1);transform:translateY(-2px)}
.grid .row::before{display:none}
.grid .topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid .heat{text-align:right;flex-shrink:0}
.grid .heat b{font-size:15px;color:var(--gold);font-weight:700}
.grid .heat small{font-size:11px;color:var(--ink2)}
.grid .company{font-size:14px;color:var(--brand);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid .company b{color:var(--brand);font-size:14.5px;font-weight:700;letter-spacing:.5px}
.grid h3{font-size:15.5px;font-weight:600;margin:9px 0 10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:46px}
.grid h3 a{color:var(--ink);text-decoration:none}
.grid h3 a:hover{color:var(--brand)}
.grid .tags{display:flex;gap:6px;flex-wrap:wrap}
.grid .tag{font-size:12px;color:var(--ink2);background:transparent;border:1px solid var(--line2);padding:2px 9px;border-radius:4px;white-space:nowrap}
.grid .tag.place{border-style:dashed;color:var(--brand2)}
.grid .meta{display:flex;gap:16px;margin-top:10px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.grid .meta .pub{color:var(--ink2);opacity:.75}
.grid .deadline{color:var(--ink);font-weight:600}
.grid .deadline.urgent{color:var(--red);font-weight:700}
.grid .deadline.soon{color:#a86f0f;font-weight:700}
.grid .actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.grid .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2)}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;background:#efe9db;color:var(--brand2);letter-spacing:.5px;white-space:nowrap}
.badge.green{background:#e4efe4;color:#2e6b3e}
.badge.red{background:#f6e3de;color:var(--red)}
.badge.gray{background:#eee9de;color:var(--ink2)}
.btn{display:inline-block;padding:7px 16px;border-radius:6px;font-size:13px;text-decoration:none;font-weight:500;font-family:inherit;border:1px solid transparent;letter-spacing:.5px;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand2);box-shadow:0 3px 10px rgba(28,42,82,.25)}
.btn-ghost{border-color:var(--line2);color:var(--ink2);background:#fff}
.btn-ghost:hover{border-color:var(--gold);color:var(--brand)}
.empty{padding:60px 20px;text-align:center;color:var(--ink2)}
.pager{display:flex;justify-content:center;gap:8px;margin-top:26px;align-items:center;flex-wrap:wrap}
.pager button{padding:8px 14px;border:1px solid var(--line2);background:#fff;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .pageinfo{font-size:13px;color:var(--ink2);margin:0 8px}
/* ===== 底部 ===== */
footer{text-align:center;color:var(--ink2);font-size:12px;padding:20px;border-top:1px solid var(--line);letter-spacing:.5px}
footer .fbrand{font-size:13px;color:var(--brand);font-weight:600;margin-bottom:4px}
@media(max-width:640px){
  .stats .stat{min-width:calc(50% - 5px)}
  .list .row{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:14px 16px}
  .list .company{white-space:normal;text-align:left}
  .list h3{white-space:normal;text-align:left}
  .list .tags{flex-wrap:wrap;justify-content:flex-start}
  .list .meta{justify-content:flex-start}
  .list .actions{justify-content:flex-start}
  .list .heat{text-align:left}
  .lock-card{padding:28px 22px}
}
</style>
</head>
<body>

<!-- ===== 口令锁屏 ===== -->
<div id="lock">
  <div class="lock-card">
    <div class="lock-logo">Tina<em>求职咨询</em></div>
    <div class="lock-sub">校招机会看板 · 每日口令解锁</div>
    <div class="pass-wrap">
      <input id="passInput" placeholder="输入今日口令" maxlength="8" autocomplete="off">
      <button id="unlockBtn">解锁</button>
    </div>
    <div id="lockErr"></div>
    <div class="qr-box">
      <img id="qrImg" alt="扫码加微信获取口令">
      <div class="qr-title">扫码添加 Tina 微信，获取今日口令</div>
      <div class="qr-tip">添加后回复 <b>「口令」</b>，自动获取当日密码<br>口令每日更新，当天有效</div>
    </div>
  </div>
</div>

<header>
  <div class="h-inner">
    <h1 class="hero-title">26年秋招岗位投递信息<em>list</em>（日更版）</h1>
    <div class="brand-row">
      <div class="brand">Tina<em>求职咨询</em></div>
      <div class="brand-sub">字节 / 阿里 / 美团 / 携程 / 小红书 / 滴滴等大厂一线在职导师</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="chips" id="chips">
      <button class="chip active" data-chip="all">全部机会</button>
      <button class="chip" data-chip="today">今日截止</button>
      <button class="chip" data-chip="d3">3天内截止</button>
      <button class="chip" data-chip="d7">7天内截止</button>
      <button class="chip" data-chip="weeknew">本周新增</button>
    </div>
    <div class="search-row">
      <input id="search" placeholder="搜索公司 / 岗位关键词，如：产品、销售、运营…" autocomplete="off">
      <div class="sort-group" id="sortGroup">
        <button data-sort="latest" class="active">最新</button>
        <button data-sort="deadline">截止</button>
        <button data-sort="hot">最热</button>
      </div>
      <div class="view-toggle" id="viewToggle">
        <button data-view="list" class="active">列表</button>
        <button data-view="grid">卡片</button>
      </div>
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="count-line" id="countLine"></div>
  <div class="list" id="list"></div>
  <div class="pager" id="pager"></div>
</main>

<footer>
  <div class="fbrand">Tina求职咨询 · 校招机会看板</div>
  <div>数据来源：公开校招公告聚合 · <span id="updatedAt"></span> · 仅供参考，以官方公告为准</div>
</footer>

<script>
/* ===== 每日口令 ===== */
function dailyCode(){
  const d = new Date();
  const s = "TINA" + d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "", x = h;
  for(let i=0;i<6;i++){
    code += chars[x % chars.length];
    x = (x * 48271) % 2147483647;
  }
  return code;
}
const TODAY_KEY = "tina_offer_unlock_" + new Date().toISOString().slice(0,10);
let unlocked = localStorage.getItem(TODAY_KEY) === "1";

/* ===== 数据 ===== */
let all = [], meta = null, board = null;
let filters = {keyword:"",classType:"",campusType:"",city:"",industry:"",job:""};
let chip = "all", sortBy = "latest", viewMode = "list", page = 1, pageSize = 20;
const $ = id => document.getElementById(id);

/* ===== 锁屏逻辑 ===== */
function showLock(){
  $("lock").classList.remove("hidden");
  $("passInput").value = "";
  $("lockErr").textContent = "";
  setTimeout(()=>$("passInput").focus(), 100);
}
function hideLock(){ $("lock").classList.add("hidden"); }
function tryUnlock(){
  const v = $("passInput").value.trim().toUpperCase();
  if(v === dailyCode()){
    localStorage.setItem(TODAY_KEY, "1");
    unlocked = true;
    hideLock();
  }else{
    $("lockErr").textContent = "口令错误，口令每日更新，扫码加微信获取当日口令";
  }
}
$("unlockBtn").onclick = tryUnlock;
$("passInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });

/* ===== 加载 ===== */
function boot(d){
  all = d.items || [];
  meta = d.meta || {};
  board = d.board || null;
  $("updatedAt").textContent = "更新于 " + (d.updatedAt || "");
  renderStats();
  buildFilters();
  if(!unlocked) showLock();
  apply();
}
async function load(){
  if(window.__OFFER_DATA__){ boot(window.__OFFER_DATA__); return; }
  // 自动重试最多 3 次（GitHub Pages 部署间隙 data.json 可能短暂不可用）
  for(let i=0;i<3;i++){
    try{
      const r = await fetch("data.json?t=" + Date.now());
      const d = await r.json();
      if(d && d.items && d.items.length){ boot(d); return; }
    }catch(e){}
    await new Promise(res=>setTimeout(res, 3000));
  }
  $("list").innerHTML = `<div class="empty">数据加载失败（网络或服务器暂不可用）<br>请稍后刷新重试，或使用自包含版本（数据内嵌）。</div>`;
}

/* ===== 统计 ===== */
function renderStats(){
  const s = board || {};
  const mk = (label, val, extra, cls) =>
    `<div class="stat ${cls||""}"><b>${val}<i>${extra||""}</i></b><small>${label}</small></div>`;
  $("stats").innerHTML =
    mk("投递机会总数", s.total ?? all.length, "", "") +
    mk("近一周新增", s.weekNew ?? "-", "条", "hot") +
    mk("今日新增", s.todayNew ?? "-", "条", "") +
    mk("未来7天截止", s.weekDeadline ?? "-", "个", "red");
}

/* ===== 岗位两级分类（14大类关键词匹配，源自数据站前端分类） ===== */
const JOB_GROUPS = [
  {id:"tech-development",name:"技术研发",keywords:["前端","后端","Java","JavaScript","Python","Golang","C++","PHP","全栈","移动端","Android","iOS","嵌入式软件","软件","架构","云计算","开发"]},
  {id:"ai-data",name:"AI/数据",keywords:["AI","人工智能","算法","深度学习","推荐算法","机器","计算机视觉","图像处理","slam","数据","BI","大数据","数据仓库","数据分析","数据工程"]},
  {id:"test-ops-security",name:"测试运维安全",keywords:["测试","运维","网络","系统工程","DBA","安全","渗透","信息安全","解决方案"]},
  {id:"product-operation",name:"产品运营",keywords:["产品","运营","用户研究","内容","增长","活动","电商","商家","品类","客服"]},
  {id:"design-game-media",name:"设计/游戏/传媒",keywords:["设计","UI","交互","视觉","画师","美术","游戏","策划","U3D","UE4","引擎","直播","短视频","剪辑","视频","主播","编辑","发行","后期"]},
  {id:"marketing-sales",name:"市场销售",keywords:["市场","销售","品牌","商务","渠道","推广","客户","SEO","公关","广告","BD","外贸"]},
  {id:"finance",name:"金融财务",keywords:["金融","银行","证券","基金","投资","投研","融资","风控","交易","量化","财务","会计","审计","税务","合规","清算"]},
  {id:"consulting-legal-admin",name:"咨询法务行政",keywords:["咨询","顾问","法务","律师","知识产权","翻译","行政","后勤","HR","人力","培训","文员","采购"]},
  {id:"education-medical",name:"教育医疗",keywords:["教师","教研","课程","培训师","园长","医学","临床","生物","医疗","医药","医生","护士","药师"]},
  {id:"electronics-communication",name:"电子通信",keywords:["电子","电器","电气","半导体","芯片","集成电路","电源","电路","射频","通信","光通信","物联网","5G","无人机","FPGA","PCB","PLC","FAE"]},
  {id:"real-estate-construction",name:"房地产建筑",keywords:["房地产","房产","建筑","土木","土建","造价","施工","监理","测绘","城市规划","消防","物业","园林","绿化"]},
  {id:"engineering-manufacturing",name:"工程制造",keywords:["制造","生产","质量","工艺","机械","机电","设备","厂务","质检","材料","冲压","锅炉","焊接","化工","实验室","有机合成","食品研发","塑料","可靠度","认证","审核"]},
  {id:"automotive-new-energy",name:"汽车新能源",keywords:["汽车","车联网","底盘","动力系统","电池","电机","充电桩","新能源","环保","EHS","环境检测"]},
  {id:"logistics-service-project",name:"物流服务项目",keywords:["供应链","物流","仓储","仓库","司机","店长","店员","服务","项目","区域负责人","总裁助理"]}
];
const OTHER_GROUP = {id:"other",name:"其他职位"};
function matchGroup(name){
  const n = (name||"").toLowerCase();
  for(const g of JOB_GROUPS){
    if(g.keywords.some(k=>n.includes(k))) return g.id;
  }
  return OTHER_GROUP.id;
}
const HOT_CITIES = ["上海","北京","广州","深圳","杭州","成都","武汉","南京","苏州","西安","重庆","长沙","天津","合肥"];

/* ===== 筛选 ===== */
function buildFilters(){
  const m = meta;
  const mk = (id, label, opts) => {
    if(!opts || !opts.length) return "";
    return `<select id="${id}"><option value="">${label}：全部</option>${opts.map(o=>`<option value="${o.value}">${o.label}</option>`).join("")}</select>`;
  };
  // 城市：热门 chips + 全部城市下拉
  const hotChips = `<span class="chip-label">城市</span>` + HOT_CITIES.map(c=>
    `<button class="chip city-chip" data-city="${c}">${c}</button>`).join("");
  // 岗位分类：14 大类（标题关键词匹配，数据源新公告无职位标签，用标题推断）
  const groupOpts = JOB_GROUPS.map(g=>`<option value="${g.id}">${g.name}</option>`).join("");
  const jobGroupSel = `<select id="fJobGroup"><option value="">岗位大类：全部</option>${groupOpts}</select>`;
  $("filters").innerHTML =
    hotChips +
    mk("fClassType","届数",(m.classTypes||[]).map(x=>({value:x.name,label:x.name}))) +
    mk("fCampusType","批次",(m.campusTypes||[]).map(x=>({value:x.name,label:x.name}))) +
    `<select id="fCity"><option value="">其他城市</option>${(m.cities||[]).map(x=>`<option value="${x.name}">${x.name}</option>`).join("")}</select>` +
    mk("fIndustry","行业",(m.industryTypes||[]).map(x=>({value:x.name,label:x.name}))) +
    jobGroupSel;
  ["fClassType","fCampusType","fCity","fIndustry"].forEach(id=>{
    const el = $(id);
    if(el) el.onchange = () => { filters[id.slice(1).toLowerCase()] = el.value; page = 1; apply(); };
  });
  // 城市 chips
  document.querySelectorAll(".city-chip").forEach(b=>{
    b.onclick = () => {
      b.classList.toggle("active");
      filters.city = b.classList.contains("active") ? b.dataset.city : "";
      document.querySelectorAll(".city-chip").forEach(x=>{ if(x!==b) x.classList.remove("active"); });
      page = 1; apply();
    };
  });
  // 岗位大类筛选
  const groupSel = $("fJobGroup");
  if(groupSel){
    groupSel.onchange = () => {
      filters.jobGroup = groupSel.value;
      filters.job = "";
      page = 1; apply();
    };
  }
}

function daysLeft(item){
  if(item.noDeadline || !item.expiredAt) return null;
  const now = new Date(), exp = new Date(item.expiredAt.replace(/-/g,"/"));
  return Math.ceil((exp - now) / 86400000);
}
function deadlineHtml(item){
  const d = daysLeft(item);
  if(item.noDeadline) return `<span class="deadline">招满即止</span>`;
  if(d === null) return `<span class="deadline">${item.expiredAt || "-"}</span>`;
  const cls = d < 0 ? "urgent" : (d <= 7 ? "soon" : "");
  const txt = d < 0 ? `已截止 ${item.expiredAt}` : `${item.expiredAt}（剩 ${d} 天）`;
  return `<span class="deadline ${cls}">${txt}</span>`;
}

function getItems(){
  let arr = [...all];
  if(filters.keyword){
    const kw = filters.keyword.toLowerCase();
    arr = arr.filter(x => (x.companyName||"").toLowerCase().includes(kw) || (x.name||"").toLowerCase().includes(kw) ||
      (x.cityNames||[]).some(c=>c.toLowerCase().includes(kw)) || (x.jobCategoryNames||[]).some(c=>c.toLowerCase().includes(kw)));
  }
  if(filters.classtype) arr = arr.filter(x=>x.classTypeNames.includes(filters.classtype));
  if(filters.campustype) arr = arr.filter(x=>x.campusTypeNames.includes(filters.campustype));
  if(filters.city) arr = arr.filter(x=>x.cityNames.includes(filters.city));
  if(filters.industry) arr = arr.filter(x=>x.industryTypeNames.includes(filters.industry));
  if(filters.job) arr = arr.filter(x=>(x.jobCategoryNames||[]).includes(filters.job));
  // 岗位大类：优先用飞书表 jobText（真实岗位文本），回退标题+公司名关键词
  if(filters.jobGroup) arr = arr.filter(x=>matchGroup((x.jobText||"") + " " + (x.name||"") + " " + (x.companyName||""))===filters.jobGroup);
  const now = new Date();
  const d7 = new Date(now.getTime() + 7*86400000);
  if(chip === "today") arr = arr.filter(x=>{ const d=daysLeft(x); return d!==null && d<=0 && d>-1; });
  if(chip === "d3") arr = arr.filter(x=>{ const d=daysLeft(x); return d!==null && d<=3 && d>=-1; });
  if(chip === "d7") arr = arr.filter(x=>{ const d=daysLeft(x); return d!==null && d<=7 && d>=-1; });
  if(chip === "weeknew") arr = arr.filter(x=>{ const c=(x.createdAt||""); return c >= new Date(now.getTime()-6*86400000).toISOString().slice(0,10); });
  if(sortBy === "latest") arr.sort((a,b)=>{
    const c = (b.createdAt||"").localeCompare(a.createdAt||"");
    if(c !== 0) return c;
    return (b.announcementId||0) - (a.announcementId||0);
  });
  if(sortBy === "deadline") arr.sort((a,b)=>{
    if(a.noDeadline && b.noDeadline) return 0;
    if(a.noDeadline) return 1;
    if(b.noDeadline) return -1;
    return (a.expiredAt||"").localeCompare(b.expiredAt||"");
  });
  if(sortBy === "hot") arr.sort((a,b)=>(b.hotScore||0)-(a.hotScore||0));
  return arr;
}

/* 列表视图：多列表格行（公司 | 公告 | 城市学历 | 截止 | 热度 | 链接） */
function listRowHtml(x){
  const tags = [
    ...(x.cityNames||[]).slice(0,3).map(c=>`<span class="tag place">${c}</span>`),
    ...(x.degreeNames||[]).slice(0,2).map(c=>`<span class="tag">${c}</span>`)
  ].join("");
  const applyHtml = x.link
    ? `<a class="btn btn-primary" href="${x.link}" target="_blank" rel="noopener">官方链接</a>`
    : "";
  const heatHtml = x.hotScore>0
    ? `<div class="heat"><b>${Math.round(x.hotScore)}</b><small>热度</small></div>`
    : "";
  return `<div class="row">
    <div class="company" title="${x.companyName||"未知公司"}">${x.companyName||"未知公司"}</div>
    <h3 title="${x.name||"-"}">${x.name||"-"}</h3>
    <div class="tags">${tags}</div>
    <div class="meta"><span>${deadlineHtml(x)}</span></div>
    ${heatHtml}
    <div class="actions">${applyHtml}</div>
  </div>`;
}

/* 卡片视图：独立卡片（标题纯文本，无超链接） */
function cardHtml(x){
  const badges = [
    ...(x.classTypeNames||[]).slice(0,2).map(n=>`<span class="badge">${n}</span>`),
    ...(x.campusTypeNames||[]).slice(0,2).map(n=>`<span class="badge green">${n}</span>`),
    ...(x.industryTypeNames||[]).slice(0,1).map(n=>`<span class="badge gray">${n}</span>`)
  ].join("");
  const tags = [
    ...(x.cityNames||[]).slice(0,3).map(c=>`<span class="tag place">${c}</span>`),
    ...(x.degreeNames||[]).slice(0,2).map(c=>`<span class="tag">${c}</span>`)
  ].join("");
  const applyHtml = x.link
    ? `<a class="btn btn-primary" href="${x.link}" target="_blank" rel="noopener">官方链接</a>`
    : "";
  const heatHtml = x.hotScore>0
    ? `<div class="heat"><b>${Math.round(x.hotScore)}</b><small>热度</small></div>`
    : "";
  return `<div class="row">
    <div class="topline">
      <div class="company"><b>${x.companyName||"未知公司"}</b></div>
      ${heatHtml}
    </div>
    <h3>${x.name||"-"}</h3>
    <div class="tags">${tags}</div>
    <div class="meta"><span>${deadlineHtml(x)}</span><span class="pub">${(x.publishedAt||x.createdAt||"").slice(5)} 发布</span></div>
    <div class="actions">${applyHtml}</div>
    <div class="badges">${badges}</div>
  </div>`;
}

function render(){
  const items = getItems();
  const total = items.length;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if(page > pages) page = pages;
  const slice = items.slice((page-1)*pageSize, page*pageSize);
  const chipLabel = {"all":"全部机会","today":"今日截止","d3":"3天内截止","d7":"7天内截止","weeknew":"本周新增"}[chip];
  $("countLine").innerHTML = total ? `「${chipLabel}」共 <b>${total}</b> 条机会` : `「${chipLabel}」暂无匹配机会`;
  const listEl = $("list");
  listEl.className = viewMode === "grid" ? "grid" : "list";
  if(!slice.length){
    listEl.innerHTML = `<div class="empty">没有匹配的机会，换个关键词试试～</div>`;
  }else{
    const fn = viewMode === "grid" ? cardHtml : listRowHtml;
    listEl.innerHTML = slice.map(fn).join("");
  }
  $("pager").innerHTML = pages > 1 ? `
    <button onclick="goPage(1)" ${page===1?"disabled":""}>«</button>
    <button onclick="goPage(${page-1})" ${page===1?"disabled":""}>‹ 上一页</button>
    <span class="pageinfo">第 ${page} / ${pages} 页</span>
    <button onclick="goPage(${page+1})" ${page===pages?"disabled":""}>下一页 ›</button>
    <button onclick="goPage(${pages})" ${page===pages?"disabled":""}>»</button>` : "";
}
function goPage(p){ page = p; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function apply(){ page = 1; render(); }

$("search").addEventListener("input", e=>{
  filters.keyword = e.target.value.trim();
  page = 1;
  clearTimeout(window._t);
  window._t = setTimeout(render, 250);
});
$("sortGroup").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  sortBy = b.dataset.sort;
  document.querySelectorAll("#sortGroup button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  apply();
});
$("viewToggle").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  viewMode = b.dataset.view;
  document.querySelectorAll("#viewToggle button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  render();
});
$("chips").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  chip = b.dataset.chip;
  document.querySelectorAll("#chips .chip").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  apply();
});
